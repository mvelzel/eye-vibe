[project]
name = "noita-eye-mystery"
version = "0.1.0"
description = "Reproducible cryptanalysis of Noita's nine eye messages"
requires-python = ">=3.11"

[project.optional-dependencies]
solver = ["z3-solver>=4.15"]
cp = ["ortools>=9.15"]
sat = ["python-sat>=1.8.dev0"]
graph = ["networkx>=3.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
